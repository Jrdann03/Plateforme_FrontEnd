<app-store-site
  [headerConfig]="headerConfig()"
  [footerConfig]="footerConfig()"
>
  @for (section of sections(); track section.id) {
    @if (section.visible !== false) {
      @switch (section.type) {
        @case ('hero') {
          <app-hero-banner [config]="section" />
        }
        @case ('product-grid') {
          <app-product-grid [config]="section" />
        }
      }
    }
  }
</app-store-site>
