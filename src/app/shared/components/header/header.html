<header
  class="store-header"
  [class.layout-classic]="config().layout === 'classic'"
  [class.layout-centered]="config().layout === 'centered'"
  [class.layout-search-focused]="config().layout === 'search-focused'"
>
  <!-- Identité de la boutique -->
  <div class="header-identity">
    <a
      class="store-brand"
      [href]="config().logo.href || '/'"
      [attr.aria-label]="'Accueil — ' + config().storeName"
    >
      @if (config().logo.visible && config().logo.imageUrl) {
        <img
          class="store-logo"
          [src]="config().logo.imageUrl"
          [alt]="config().logo.alt || config().storeName"
        />
      }

      <span class="store-name">
        {{ config().storeName }}
      </span>
    </a>
  </div>

  <!-- Navigation principale -->
  @if (config().navigation.length > 0) {
    <nav
      class="store-navigation"
      aria-label="Navigation principale"
    >
      @for (item of config().navigation; track item.id) {
        @if (item.visible !== false) {
          <a
            class="nav-link"
            [href]="item.href"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>
  }

  <!-- Barre de recherche -->
  @if (config().search.visible) {
    <form
      class="search-form"
      role="search"
      (submit)="onSearchSubmit($event)"
    >
      <label
        class="visually-hidden"
        for="store-search"
      >
        Rechercher un produit
      </label>

      <span
        class="search-icon"
        aria-hidden="true"
      >
        ⌕
      </span>

      <input
        id="store-search"
        type="search"
        name="query"
        [placeholder]="
          config().search.placeholder || 'Rechercher un produit...'
        "
        [value]="searchTerm()"
        (input)="onSearchInput($event)"
      />

      @if (searchTerm()) {
        <button
          class="clear-button"
          type="button"
          aria-label="Effacer la recherche"
          (click)="clearSearch()"
        >
          ×
        </button>
      }

      <button
        class="search-button"
        type="submit"
      >
        Rechercher
      </button>
    </form>
  }
</header>
